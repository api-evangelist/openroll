aid: openroll
name: Openroll
description: >-
  Openroll is an AI-native operating system for compensation, built for People and Finance teams.
  It connects to existing HRIS, ATS, ERP, and finance systems, runs fully auditable analyses, and
  turns repeated workflows into agentic operations - covering compensation reviews, salary bands,
  headcount planning, pay-strategy monitoring, and actuals-versus-budget variance. Founded in 2024
  and backed by Y Combinator, Openroll operates from San Francisco and Stockholm, is SOC 2 Type I
  and Type II certified and GDPR compliant, and never uses customer data to train its AI models.
